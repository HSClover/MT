name: SignTranslatorApp
options:
  bundleIdPrefix: com.hsclover
  deploymentTarget:
    iOS: "16.0"

targets:
  SignTranslatorApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsclover.signtranslator
        PRODUCT_NAME: SignTranslatorApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "실시간 수어 동작 인식을 위해 카메라 접근 권한이 필요합니다."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Windows PC 추론 서버와 실시간 수어 데이터를 주고받기 위해 로컬 네트워크 접근이 필요합니다."
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
